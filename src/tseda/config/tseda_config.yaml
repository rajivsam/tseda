# ============================================================================
# TSEDA Configuration File
# ============================================================================
# This file contains all configurable thresholds, parameters, and limits
# used throughout the tseda application. Modify these values to customize
# algorithm behavior without changing code.
#
# Configuration is loaded at application startup. Changes take effect only
# after restarting the application.
# ============================================================================

# ============================================================================
# Section 1: File Upload Limits
# ============================================================================
file_upload:
  # Minimum allowed sampling interval for uploaded time series data.
  # Lower values imply sub-5-minute sampling, which is too granular for this SSA workflow.
  # Default: 5
  # Suggested range: 5 - 60
  min_sampling_frequency_minutes: 5

  # Maximum number of rows allowed in uploaded CSV/Excel files.
  # Higher values require more memory and may impact UI responsiveness.
  # Default: 5000
  # Suggested range: 1000 - 5000
  max_file_lines: 5000

# ============================================================================
# Section 2: Window Selection (Cadence-to-Window Mapping)
# ============================================================================
# Initial SSA window sizes based on detected sampling frequency.
# Each value represents one expected seasonal cycle at the given cadence.
# These are starting points; windows may be doubled during refinement if
# the eigenvalue spectrum is too flat.
window_selection:
  # Duration of the default seasonal cycle for data sampled more frequently
  # than hourly. The effective SSA window is this value divided by the
  # observed sampling interval (for example, 15-minute data uses 96).
  # Default: 1440 (one day)
  subhourly_cycle_minutes: 1440

  # One diurnal (24-hour) cycle
  # Default: 24
  hourly: 24

  # One business week (5 trading/working days)
  # Default: 5
  daily: 5

  # Approximately one calendar month (4 weeks)
  # Default: 4
  weekly: 4

  # One full annual cycle (12 months)
  # Default: 12
  monthly: 12

  # One full annual cycle (4 quarters)
  # Default: 4
  quarterly: 4

  # How many additional window values to keep beyond the method-optimal point
  # when drawing the diagnostic curves. This keeps the elbow/plateau visible in
  # the comparison plot and gives enough headroom for all three subplots.
  # Default: 5
  window_ext_optimal: 5

  # Maximum number of sampling points to draw for each window-selection curve.
  # In the stacked single-column dialog view, each panel gets substantially more
  # vertical space, so we can increase the point density and make the elbow or
  # plateau more obvious without crowding the figure.
  # Default: 53 (five more points beyond the prior stacked-dialog setting)
  plot_points_per_curve: 53

# ============================================================================
# Section 3: SSA Eigenvalue Grouping Heuristic
# ============================================================================
# Parameters controlling how SSA components are classified as Trend,
# Seasonality, or Noise.
grouping_heuristic:
  # Strategy used to define the initial signal pool before DW-guided expansion.
  # "kneedle" detects a noise floor via an elbow in the eigen spectrum.
  # "variance_threshold" retains the legacy explained-variance rule.
  # Default: "kneedle"
  pool_selection_method: "kneedle"

  # Minimum explained variance ratio for a component to be considered "eligible".
  # Used only when pool_selection_method is "variance_threshold".
  # Default: 0.05
  # Suggested range: 0.03 - 0.20
  variance_threshold: 0.05

  # Maximum allowed relative difference between paired eigenvalues.
  # When two adjacent eigenvalues differ by <= this fraction, they are
  # considered a pair and assigned to seasonality.
  # Formula: (larger - smaller) / larger <= pair_similarity_tolerance
  # Default: 0.05
  # Suggested range: 0.02 - 0.10
  pair_similarity_tolerance: 0.05

  # Minimum normalized knee distance required to accept a detected elbow.
  # Larger values make the algorithm more conservative (smaller signal pool).
  # Default: 0.03
  # Suggested range: 0.01 - 0.08
  kneedle_min_distance: 0.03

  # Lower bound on number of components to include in the initial signal pool.
  # This prevents empty or unstable signal assignments on flat spectra.
  # Default: 1
  min_signal_components: 1

  # Lower bound on number of components kept in the initial noise pool.
  # This preserves room for DW-guided reassignment and residual validation.
  # Default: 2
  min_noise_components: 2

# ============================================================================
# Section 4: Durbin-Watson Noise Quality Check
# ============================================================================
# The Durbin-Watson (DW) statistic measures autocorrelation in the noise
# residual. A value near 2.0 indicates uncorrelated noise (ideal).
# Values outside the range [dw_low, dw_high] suggest residual autocorrelation.
noise_validation:
  # Minimum acceptable Durbin-Watson statistic.
  # Default: 1.5
  # Suggested range: 1.4 - 1.6
  dw_low: 1.5

  # Maximum acceptable Durbin-Watson statistic.
  # Default: 2.5
  # Suggested range: 2.4 - 2.6
  dw_high: 2.5

# ============================================================================
# Section 5: Window Refinement
# ============================================================================
# After initial window selection, the algorithm checks if the spectrum
# has enough spread. If the smallest eigenvalue explains too much variance,
# the window is doubled and SSA is recomputed.
window_refinement:
  # Minimum acceptable fraction of total variance explained by the smallest
  # eigenvalue. If the smallest eigenvalue explains MORE than this fraction,
  # the window is doubled and SSA is recomputed.
  # This ensures the eigenvalue spectrum has meaningful spread.
  # Default: 0.10
  # Suggested range: 0.05 - 0.15
  min_tail_spread: 0.10

# ============================================================================
# Section 6: SSA Seasonality Heuristic
# ============================================================================
# Parameters controlling the seasonality detection check.
seasonality_heuristic:
  # Number of leading eigenvalues to inspect for paired (near-equal) structure.
  # Higher values inspect more components; lower values focus on top components only.
  # Default: 6
  # Suggested range: 4 - 12
  leading_eigenvalues_to_check: 6

# ============================================================================
# Section 7: Periodicity Analysis (FFT / Lomb-Scargle)
# ============================================================================
# Parameters for frequency-domain analysis using Lomb-Scargle periodograms.
periodicity:
  # Minimum search frequency (cycles per sample).
  # Default: 0.1
  fmin: 0.1

  # Maximum search frequency (cycles per sample).
  # Default: 2.0
  fmax: 2.0

  # Number of discrete frequency points to evaluate.
  # Higher values give finer frequency resolution but increase computation cost.
  # Default: 1000
  # Suggested range: 500 - 2000
  num_frequencies: 1000

# ============================================================================
# Section 8: Segmentation and Final-Window Safety
# ============================================================================
# Parameters controlling the minimum admissible size for the working segment and
# the half-life look-back used when the final PELT regime is too short.
segmentation:
  # Minimum admissible points for a final selected analysis segment. When set to
  # null, tseda falls back to the cadence-specific default in
  # resolve_minimum_segment_points(). The sub-hourly default uses one day of
  # observations at the observed sampling interval (for example: 5 min -> 288,
  # 15 min -> 96). Default: null
  minimum_final_segment_points: null

  # Half-life used in the weighted look-back when the final segment is too short.
  # Larger values make the fallback more conservative and spread the look-back
  # over more preceding observations. Default: 30.0
  final_segment_half_life: 30.0

  # Cumulative weight threshold used to determine how far back the final segment
  # should be expanded. A value near 1.0 means "use enough preceding points to
  # cover most of the half-life mass". Default: 0.95
  final_segment_weight_threshold: 0.95

# ============================================================================
# Section 9: LOESS Smoothing
# ============================================================================
# Parameters for LOESS (Locally Estimated Scatterplot Smoothing) verification plot.
# The LOESS smoother uses a sliding-window local regression; the fraction
# parameter controls the width of each window.
loess:
  # Minimum smoothing fraction.
  # Lower values produce noisier but more detailed curves.
  # Default: 0.05
  min_fraction: 0.05

  # Maximum smoothing fraction.
  # Higher values produce smoother curves but may hide detail.
  # Default: 0.5
  max_fraction: 0.5

  # Default LOESS fraction shown in the UI slider.
  # Default: 0.05
  default_fraction: 0.05

  # Slider increment step size.
  # Default: 0.05
  step: 0.05

# ============================================================================
# Section 9: Change Point Detection
# ============================================================================
# Parameters for the PELT (Pruned Exact Linear Time) change-point detection
# algorithm applied to both Trend and Seasonal components.
change_point_detection:
  # Cost model for PELT algorithm.
  # Options: "rbf" (radial basis function), "l2", "linear"
  # "rbf" is robust and recommended for most time series.
  # Default: "rbf"
  model: "rbf"

  # Multiplier for BIC-style penalty: penalty = penalty_multiplier * log(n)
  # where n is the series length.
  # Higher values discourage finding many small segments (conservative).
  # Lower values permit more breakpoints (liberal).
  # Default: 2.0 (standard BIC)
  # Suggested range: 1.5 - 2.5
  penalty_multiplier: 2.0

# ============================================================================
# Section 10: Dataset Suitability Check
# ============================================================================
# SSA requires a structured eigenspectrum where a small number of eigenvectors
# dominate. If variance is diffusely spread across all eigenvectors, the series
# is essentially noise and SSA decomposition will be uninformative.
# When the suitability check fails, the Apply Grouping button is disabled and
# the user is advised to use a noise-based modelling approach (e.g. ARIMA).
suitability_check:
  # Number of top eigenvectors to sum for the concentration test.
  # These should account for the dominant structural components (trend + seasonality).
  # Default: 5
  # Suggested range: 3 - 8
  top_k_eigenvectors: 5

  # Minimum fraction of total variance the top-k eigenvectors must explain.
  # If the actual ratio falls below this threshold, the dataset is deemed unsuitable.
  # Default: 0.40
  # Suggested range: 0.30 - 0.55
  min_explained_variance: 0.40
