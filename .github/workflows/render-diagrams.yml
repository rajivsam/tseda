name: Render diagram assets

on:
  push:
    paths:
      - 'docs/diagrams/**'
      - '.github/workflows/render-diagrams.yml'
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - '.github/workflows/render-diagrams.yml'
  workflow_dispatch:

jobs:
  render-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX and conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-latex-extra \
            pdf2svg

      - name: Render TikZ diagrams to SVG
        run: |
          set -e
          mkdir -p docs/diagrams/out
          for src in docs/diagrams/*.tex; do
            base="$(basename "$src" .tex)"
            pdflatex -interaction=nonstopmode -halt-on-error \
              -output-directory=docs/diagrams/out "$src"
            pdf2svg "docs/diagrams/out/${base}.pdf" "docs/diagrams/${base}.svg"
          done

      - name: Commit generated SVGs
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*.svg || true
          if ! git diff --cached --quiet; then
            git commit -m "Render diagram assets"
            git push
          fi
