[project]
name = "tseda"
version = "3.3"
description = "A package for exploration of regularly sampled time series."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
keywords = ["time-series", "ssa", "dash", "analytics", "decomposition"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "dash>=4.1.0",
  "dash-ag-grid>=31.3.1",
  "dash-bootstrap-components>=2.0.4",
  "kaggle>=2.0.0",
  "kdepy>=1.1.12",
  "kmds>=0.3.1",
  "matplotlib>=3.10.8",
  "numpy>=2.4.0",
  "pandas>=2.3.3",
  "plotly>=6.5.0",
  "python-dotenv>=1.2.1",
  "ruptures>=1.1.10",
  "scipy<1.16.0",
  "ssalib>=0.1.3",
  "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0.0",
]
docs = [
  "sphinx>=8.0",
  "furo>=2024.8.6",
  "myst-parser>=3.0",
  "sphinx-copybutton>=0.5",
]

[project.scripts]
tseda = "tseda.user_interface.ts_analyze_ui:main"
bump-version = "tseda.bump_version:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tseda*"]

[tool.setuptools.package-data]
tseda = [
  "images/*",
  "AGENTS.md",
]
